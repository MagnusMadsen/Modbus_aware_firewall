
services:
  postgres:
    image: postgres:16-alpine
    container_name: modbus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./services/db/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - modbus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modbus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - modbus_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: modbus_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: INFO
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      BACKEND_API_TOKEN_FILE: /run/secrets/backend_api_token
      APP_USERNAME: ${APP_USERNAME}
      FRONTEND_PASSWORD_HASH_FILE: /run/secrets/frontend_password_hash
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE}
      SWITCH_INTERFACE: ${SWITCH_INTERFACE}
      SWITCH_INTERFACE_IP: ${SWITCH_INTERFACE_IP}
      TZ: ${TZ}
      SWITCH_IP: ${SWITCH_IP}
      SNMP_COMMUNITY_FILE: /run/secrets/snmp_community
      SNMP_VERSION: ${SNMP_VERSION}
    volumes:
      - ./services/backend:/app
      - ./services/db/init:/db/init:ro
      - ./data/logs/backend:/app/logs
      - ./data/pcap:/app/pcap
    working_dir: /app
    command: python app/main.py
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
      - backend_api_token
      - frontend_password_hash
      - snmp_community

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: modbus_frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: ${API_BASE_URL}
      APP_ENV: ${APP_ENV}
      TZ: ${TZ}
      BACKEND_API_TOKEN_FILE: /run/secrets/backend_api_token
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: frontend_secret_key
        target: frontend_secret_key
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: backend_api_token
        target: backend_api_token
        uid: "10001"
        gid: "10001"
        mode: 0444
    networks:
      - modbus_net
    ports:
      - "${FRONTEND_PORT}:5000"
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - ./data/logs/frontend:/app/logs
    working_dir: /app
    command: gunicorn -b 0.0.0.0:5000 --workers 2 --threads 4 --timeout 30 app.main:app

networks:
  modbus_net:
    driver: bridge

secrets:
  frontend_secret_key:
    file: ./secrets/frontend_secret_key.txt
  frontend_password_hash:
    file: ./secrets/frontend_password_hash.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  backend_api_token:
    file: ./secrets/backend_api_token.txt
  snmp_community:
    file: ./secrets/snmp_community.txt