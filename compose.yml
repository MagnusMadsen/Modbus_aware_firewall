
services:
  postgres:
    image: postgres:16-alpine
    container_name: modbus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modbus_fw
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./services/db/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - modbus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d modbus_fw"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: modbus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - modbus_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: modbus_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: modbus_fw
      DB_USER: admin
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      BACKEND_API_TOKEN_FILE: /run/secrets/backend_api_token
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CAPTURE_INTERFACE: eth0
      SWITCH_INTERFACE: enxac7f3ee618a6
      SWITCH_INTERFACE_IP: 192.168.61.250/24
      TZ: Europe/Copenhagen
      SWITCH_IP: 192.168.61.162
      SNMP_COMMUNITY_FILE: /run/secrets/snmp_community
      SNMP_VERSION: 2c
    volumes:
      - ./services/backend:/app
      - ./data/logs/backend:/app/logs
      - ./data/pcap:/app/pcap
    working_dir: /app
    command: python app/main.py
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
      - backend_api_token
      - snmp_community

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: modbus_frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://host.docker.internal:8000
      APP_ENV: development
      TZ: Europe/Copenhagen
      APP_USERNAME: admin
      BACKEND_API_TOKEN_FILE: /run/secrets/backend_api_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: frontend_secret_key
        target: frontend_secret_key
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: frontend_password_hash
        target: frontend_password_hash
        uid: "10001"
        gid: "10001"
        mode: 0444
      - source: backend_api_token
        target: backend_api_token
        uid: "10001"
        gid: "10001"
        mode: 0444
    networks:
      - modbus_net
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./services/frontend:/app
      - ./data/logs/frontend:/app/logs
    working_dir: /app
    command: python app/main.py

networks:
  modbus_net:
    driver: bridge

secrets:
  frontend_secret_key:
    file: ./secrets/frontend_secret_key.txt
  frontend_password_hash:
    file: ./secrets/frontend_password_hash.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  backend_api_token:
    file: ./secrets/backend_api_token.txt
  snmp_community:
    file: ./secrets/snmp_community.txt